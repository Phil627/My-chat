<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Общалка из 2000-х</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
</head>
<body>
  <div class="chat-container">
    <h1>💬 Общалка</h1>
    <input type="text" id="nickname" placeholder="Твой ник" value="Гость" />
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Напиши сообщение..." />
      <button id="sendBtn">🚀</button>
    </div>
    <div class="smileys">
      <span class="smiley" data-smiley="🙂">🙂</span>
      <span class="smiley" data-smiley="😂">😂</span>
      <span class="smiley" data-smiley="❤️">❤️</span>
      <span class="smiley" data-smiley="🔥">🔥</span>
      <span class="smiley" data-smiley="✨">✨</span>
    </div>
    <div id="typingIndicator" style="color: #0099cc; font-size: 0.8em; margin: 10px 0; display: none;"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
